name: Temporary Bun lockfile regeneration
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Regenerate lockfile from package.json
        run: bun install
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock
          path: bun.lock
          if-no-files-found: error
